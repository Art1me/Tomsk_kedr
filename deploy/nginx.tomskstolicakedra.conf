server {
    listen 80;
    server_name tomskstolicakedra.red.tpu.ru;

    root /var/www/kedr/frontend;
    index index.html;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


location /static/ {
        alias /var/www/kedr/source/Kedr_backend/staticfiles/;
    }

    location /media/ {
        alias /var/www/kedr/source/Kedr_backend/media/;
    }

    location /osm_tiles/ {
        proxy_pass https://tile.openstreetmap.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "TomskKedr/1.0 (tomskstolicakedra.red.tpu.ru)";
        proxy_set_header Referer "";
        proxy_buffering on;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}
