server {
    listen 80;
    server_name tomskstolicakedra.red.tpu.ru;

    root /var/www/kedr/frontend;
    index index.html;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


location /static/ {
        alias /var/www/kedr/source/Kedr_backend/staticfiles/;
    }

    location /media/ {
        alias /var/www/kedr/source/Kedr_backend/media/;
    }
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}
