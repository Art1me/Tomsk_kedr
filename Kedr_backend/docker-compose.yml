services:
  web:
    build: .
    container_name: tomsk-kedr-backend
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn Tomsk_kedr.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    restart: unless-stopped
