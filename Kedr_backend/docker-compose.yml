services:
  web:
    build: .
    container_name: tomsk-kedr-backend
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn Tomsk_kedr.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 120 --graceful-timeout 30 --keep-alive 5"
    env_file:
      - .env
    network_mode: "host"
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    restart: unless-stopped
